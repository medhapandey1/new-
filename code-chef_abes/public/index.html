<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CodeChef ABESEC – Club Events</title>
<style>
:root{--bg:#faf6f0;--card:#fff;--tx:#2a1f17;--mu:#7d6b5c;--ac:#e0580f;--ac2:#f5a524;--bd:#eadfd2;--ok:#1a8f5a;--sh:0 8px 30px #5b463814;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#140f0b;--card:#1f1813;--tx:#f6ece2;--mu:#b3a190;--ac:#ff8a3d;--bd:#33281f;--ok:#4cd08f;--sh:0 8px 30px #0006}}
:root[data-theme="dark"]{--bg:#140f0b;--card:#1f1813;--tx:#f6ece2;--mu:#b3a190;--ac:#ff8a3d;--bd:#33281f;--ok:#4cd08f;--sh:0 8px 30px #0006}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd)}
nav{max-width:1120px;margin:auto;display:flex;align-items:center;gap:8px;padding:10px 16px}
.logo{font-weight:800;text-decoration:none;color:var(--tx);display:flex;align-items:center;gap:8px;margin-right:auto;font-size:1.05rem}
.logo i{font-style:normal;background:linear-gradient(135deg,var(--ac),var(--ac2));border-radius:10px;padding:2px 7px;color:#fff;font-size:.9rem}
.logo span{color:var(--ac)}
nav a.l{text-decoration:none;color:var(--mu);font-weight:600;padding:7px 13px;border-radius:99px;font-size:.95rem}
nav a.l.on{color:var(--tx);background:var(--card);box-shadow:inset 0 0 0 1px var(--bd)}
#th{border:1px solid var(--bd);background:var(--card);border-radius:99px;width:36px;height:36px;cursor:pointer;font-size:1rem}
main{max-width:1120px;margin:auto;padding:16px}
.hero{position:relative;overflow:hidden;border-radius:26px;background:radial-gradient(900px 400px at 90% -10%,#e0580f66,transparent),#1d130c;color:#fff;padding:clamp(22px,5vw,56px);display:grid;gap:28px;grid-template-columns:1fr;align-items:center}
@media(min-width:860px){.hero{grid-template-columns:1.1fr .9fr}}
.pill{display:inline-block;font-size:.78rem;padding:4px 12px;border-radius:99px;background:#ffffff1a;border:1px solid #ffffff2b;color:#ffd7b0}
.hero h1{font-size:clamp(2.1rem,6vw,3.6rem);line-height:1.05;margin:14px 0;letter-spacing:-.03em}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#ff8a3d,#ffd166);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:#e6d3c0;max-width:520px;margin:0 0 22px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;cursor:pointer;background:var(--ac);color:#fff;padding:11px 20px;border-radius:12px;font:inherit;font-weight:700;text-decoration:none;transition:transform .15s,box-shadow .15s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 20px #e0580f55}
.btn.g{background:#ffffff1a;border:1px solid #ffffff33}
.btn.o{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.done,.btn:disabled{background:var(--bd);color:var(--mu);cursor:default}
.btn.done{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.code{background:#0f0a07;border:1px solid #ffffff1f;border-radius:16px;box-shadow:0 20px 50px #0008;font-size:.85rem}
.code .h{display:flex;gap:6px;padding:10px 14px;border-bottom:1px solid #ffffff14}
.code .h b{width:10px;height:10px;border-radius:50%;background:#ff5f56}.code .h b:nth-child(2){background:#ffbd2e}.code .h b:nth-child(3){background:#27c93f}
.code pre{margin:0;padding:16px;color:#e6d3c0;overflow-x:auto;line-height:1.7}
.k{color:#ff8a3d}.s{color:#7ee0a3}.f{color:#ffd166}.c{color:#8a7565}
.cur{display:inline-block;width:8px;height:1em;background:#ffd166;vertical-align:-2px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;text-align:center}
.stat b{display:block;font-size:1.5rem;color:var(--ac)}.stat span{color:var(--mu);font-size:.85rem}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:36px 0 14px}
.sec h2{margin:0;font-size:1.5rem;letter-spacing:-.02em}
.sec a{color:var(--ac);font-weight:700;text-decoration:none}
.feat{display:grid;grid-template-columns:1fr;border-radius:24px;overflow:hidden;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh)}
@media(min-width:800px){.feat{grid-template-columns:.8fr 1.2fr}}
.feat .art{display:grid;place-items:center;min-height:180px;font-size:5rem;background:linear-gradient(135deg,var(--c),#0006),var(--c)}
.feat .bd{padding:clamp(18px,4vw,32px)}
.feat h3{font-size:1.6rem;margin:8px 0;letter-spacing:-.02em}
.cd{display:flex;gap:10px;margin:16px 0}
.cd div{background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:8px 0;width:64px;text-align:center;font-size:.72rem;color:var(--mu)}
.cd b{display:block;font-size:1.4rem;color:var(--tx);font-family:ui-monospace,Menlo,monospace}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac)}
.meta{display:grid;gap:2px;color:var(--mu);font-size:.9rem}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(285px,1fr))}
.card{background:var(--card);border:1px solid var(--bd);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:var(--sh)}
.card .top{height:96px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;background:linear-gradient(135deg,var(--c),#0005),var(--c)}
.em{font-size:2.4rem}
.db{background:#fff;color:#2a1f17;border-radius:12px;padding:4px 12px;text-align:center;font-size:.72rem;font-weight:700;text-transform:uppercase;line-height:1.2}
.db b{display:block;font-size:1.4rem}
.cb{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.cb h3{margin:2px 0 0;font-size:1.1rem}
.cb p{margin:0;color:var(--mu);font-size:.92rem;flex:1}
.cb .btn{margin-top:6px;width:100%}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 12px}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:11px 14px;width:100%;outline:0}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
.bar input{flex:1 1 240px;width:auto}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--mu);border-radius:99px;padding:7px 15px;font:inherit;font-weight:600;font-size:.9rem;cursor:pointer}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.cnt{color:var(--mu);font-size:.9rem;margin-bottom:12px}
.empty{grid-column:1/-1;text-align:center;color:var(--mu);padding:48px 12px}
.modal{position:fixed;inset:0;background:#0009;backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center;z-index:30}
.modal.open{display:flex}
@media(min-width:560px){.modal{align-items:center;padding:16px}}
.box{background:var(--card);border-radius:22px 22px 0 0;padding:22px;width:100%;max-width:480px;max-height:92%;overflow:auto;animation:up .25s ease;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
@media(min-width:560px){.box{border-radius:22px}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.box h3{margin:0 0 4px;font-size:1.25rem}
label{display:block;font-weight:600;font-size:.85rem;margin-top:12px;margin-bottom:5px}
.err{color:#e03b3b;font-size:.78rem;min-height:1em;margin-top:3px}
.row{display:grid;gap:0 12px;grid-template-columns:1fr}
@media(min-width:480px){.row{grid-template-columns:1fr 1fr}}
.acts{display:flex;gap:10px;margin-top:18px}.acts .btn{flex:1}
.ok{text-align:center;padding:8px 0}
.ok .c{width:64px;height:64px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:2rem;margin:0 auto 12px;animation:pop .4s}
@keyframes pop{from{transform:scale(0)}}
.note{background:color-mix(in srgb,var(--ac2) 18%,transparent);border-radius:10px;padding:6px 10px;font-size:.8rem;margin-top:10px}
footer{text-align:center;color:var(--mu);padding:36px 16px;font-size:.9rem}
</style>
</head>
<body>
<header><nav>
<a class="logo" href="#/"><i class="mono">&lt;/&gt;</i>CodeChef <span>ABESEC</span></a>
<a class="l" id="n-home" href="#/">Home</a><a class="l" id="n-events" href="#/events">Events</a>
<button id="th" aria-label="Toggle theme">🌓</button>
</nav></header>
<main id="app"></main>
<footer>© 2026 CodeChef ABESEC · ABES Engineering College</footer>
<div class="modal" id="modal"><div class="box" id="box"></div></div>

<script>
const SAMPLE=[
{id:1,name:"HackVerse 24-Hour Hackathon",club:"CodeChef ABESEC",cat:"Technology",date:"2026-10-17T09:00",venue:"Main Auditorium",desc:"Build, break and ship in 24 hours. Teams of up to 4, mentors on call and prizes worth ₹50,000.",emoji:"💻",c:"#5b47e0",featured:1},
{id:2,name:"Open Mic Night",club:"CodeChef ABESEC",cat:"Arts & Culture",date:"2026-10-05T18:00",venue:"Amphitheatre",desc:"Sing, strum or spit poetry. Sign up for a slot or just come and cheer.",emoji:"🎤",c:"#e0479a"},
{id:3,name:"Inter-College Football Cup",club:"CodeChef ABESEC",cat:"Sports",date:"2026-10-11T08:30",venue:"University Ground",desc:"Knockout tournament featuring 8 colleges. Register your team or come to support.",emoji:"⚽",c:"#1a8f5a"},
{id:4,name:"Startup Pitch Night",club:"CodeChef ABESEC",cat:"Career",date:"2026-10-24T16:00",venue:"Seminar Hall B",desc:"Pitch your idea to alumni founders and investors. Feedback guaranteed.",emoji:"🚀",c:"#e0580f"},
{id:5,name:"Photography Walk: Old City",club:"CodeChef ABESEC",cat:"Arts & Culture",date:"2026-10-10T06:30",venue:"Gate 1 (meeting point)",desc:"Golden-hour street photography walk with a pro. Bring any camera, phones welcome.",emoji:"📷",c:"#8f5bff"},
{id:6,name:"Intro to Machine Learning Workshop",club:"CodeChef ABESEC",cat:"Technology",date:"2026-11-02T14:00",venue:"Computer Lab 3",desc:"Hands-on beginner workshop: train your first model in Python. Laptops required.",emoji:"🤖",c:"#2b8fd6"},
{id:7,name:"Campus Clean-Up Drive",club:"CodeChef ABESEC",cat:"Community",date:"2026-10-19T07:30",venue:"Central Lawn",desc:"Join us to clean and plant saplings across campus. Gloves and snacks provided.",emoji:"🌱",c:"#3aa655"},
{id:8,name:"Resume & LinkedIn Clinic",club:"CodeChef ABESEC",cat:"Career",date:"2026-11-07T11:00",venue:"Seminar Hall A",desc:"Get your resume reviewed one-on-one by industry mentors.",emoji:"📄",c:"#d68b2b"}
];
let EVENTS=[],LIVE=false,timer,cat="All",q="";
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dt=d=>new Date(d),past=e=>dt(e.date)<new Date();
const fD=d=>dt(d).toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"});
const fT=d=>dt(d).toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"});
const sorted=()=>[...EVENTS].sort((a,b)=>dt(a.date)-dt(b.date));
const upcoming=()=>sorted().filter(e=>!past(e));
let regs=[];try{regs=JSON.parse(localStorage.getItem("regs")||"[]")}catch(e){}
const isReg=id=>regs.includes(id);

$("#th").onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=d?"light":"dark"};

function card(e){const r=isReg(e.id),p=past(e),d=dt(e.date);
return `<article class="card"><div class="top" style="--c:${esc(e.c)}"><span class="em">${e.emoji}</span><div class="db"><b>${d.getDate()}</b>${d.toLocaleString("en-IN",{month:"short"})}</div></div>
<div class="cb"><span class="tag">${esc(e.cat)}</span><h3>${esc(e.name)}</h3>
<div class="meta"><span>🕒 ${fD(e.date)} · ${fT(e.date)}</span><span>📍 ${esc(e.venue)}</span></div><p>${esc(e.desc)}</p>
<button class="btn ${r?"done":""}" data-reg="${e.id}" ${r||p?"disabled":""}>${r?"✓ Registered":p?"Ended":"Register →"}</button></div></article>`}

function tick(f){const el=$("#cd");if(!el)return;let s=Math.max(0,Math.floor((dt(f.date)-Date.now())/1000));
el.innerHTML=[["Days",86400],["Hrs",3600],["Min",60],["Sec",1]].map(([n,k])=>{const v=Math.floor(s/k);s%=k;return `<div><b>${String(v).padStart(2,"0")}</b>${n}</div>`}).join("")}

function home(){
 const up=upcoming(),f=EVENTS.find(e=>e.featured&&!past(e))||up[0];
 app.innerHTML=`<section class="hero"><div><span class="pill mono">● ABES Engineering College</span>
 <h1>Code. Compete. <em>Create.</em></h1>
 <p>CodeChef ABESEC is our campus community for competitive programming and tech. Join contests, workshops and hackathons, sharpen your skills and grow with fellow coders.</p>
 <a class="btn" href="#/events">Explore events →</a></div>
 <div class="code mono"><div class="h"><b></b><b></b><b></b></div><pre><span class="c"># your next move</span>
<span class="k">def</span> <span class="f">join</span>(you):
    club = <span class="s">"CodeChef ABESEC"</span>
    <span class="k">while</span> you.learning():
        you.<span class="f">code</span>()
        you.<span class="f">compete</span>()
    <span class="k">return</span> you.<span class="f">level_up</span>()<span class="cur"></span></pre></div></section>
 <div class="stats"><div class="stat"><b>500+</b><span>Members</span></div><div class="stat"><b>50+</b><span>Contests</span></div><div class="stat"><b>${EVENTS.length}</b><span>Events</span></div></div>
 ${f?`<div class="sec"><h2>⭐ Featured event</h2></div>
 <div class="feat"><div class="art" style="--c:${esc(f.c)}">${f.emoji}</div><div class="bd"><span class="tag">${esc(f.cat)}</span>
 <h3>${esc(f.name)}</h3><div class="meta"><span>🕒 ${fD(f.date)} · ${fT(f.date)}</span><span>📍 ${esc(f.venue)}</span></div>
 <div class="cd" id="cd"></div><p style="color:var(--mu);margin:0 0 16px">${esc(f.desc)}</p>
 <button class="btn ${isReg(f.id)?"done":""}" data-reg="${f.id}" ${isReg(f.id)?"disabled":""}>${isReg(f.id)?"✓ Registered":"Register now →"}</button></div></div>`:""}
 <div class="sec"><h2>Upcoming events</h2><a href="#/events">View all →</a></div>
 <div class="grid">${up.slice(0,3).map(card).join("")||'<div class="empty">No upcoming events yet. Check back soon!</div>'}</div>`;
 if(f){tick(f);timer=setInterval(()=>tick(f),1000)}
}

function events(){
 const cats=["All",...new Set(EVENTS.map(e=>e.cat))].sort((a,b)=>a==="All"?-1:b==="All"?1:a.localeCompare(b));
 app.innerHTML=`<h1 style="margin:8px 0;letter-spacing:-.02em">All events</h1>
 <div class="bar"><input id="q" type="search" placeholder="🔍 Search events by name" value="${esc(q)}" aria-label="Search events"></div>
 <div class="chips" role="tablist">${cats.map(c=>`<button class="chip ${c===cat?"on":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div>
 <div class="cnt" id="cnt"></div><div class="grid" id="list"></div>`;
 const draw=()=>{const s=q.trim().toLowerCase();
  const r=sorted().filter(e=>(cat==="All"||e.cat===cat)&&e.name.toLowerCase().includes(s)).sort((a,b)=>past(a)-past(b));
  $("#cnt").textContent=r.length+" event"+(r.length===1?"":"s");
  $("#list").innerHTML=r.length?r.map(card).join(""):'<div class="empty">😕 No events match your search.</div>'};
 $("#q").oninput=e=>{q=e.target.value;draw()};
 document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));draw()});
 draw();
}

function route(){clearInterval(timer);
 const p=location.hash.replace("#/","")||"home";
 $("#n-home").classList.toggle("on",p==="home");$("#n-events").classList.toggle("on",p==="events");
 p==="events"?events():home();window.scrollTo(0,0)}
addEventListener("hashchange",route);
(async()=>{try{const r=await fetch("/api/events");if(!r.ok||!(r.headers.get("content-type")||"").includes("json"))throw 0;EVENTS=await r.json();LIVE=true}catch(e){EVENTS=SAMPLE}route()})();

const modal=$("#modal"),box=$("#box"),close=()=>modal.classList.remove("open");
modal.onclick=e=>{if(e.target===modal)close()};
addEventListener("keydown",e=>{if(e.key==="Escape")close()});

document.addEventListener("click",e=>{
 const b=e.target.closest("[data-reg]");if(!b||b.disabled)return;
 const ev=EVENTS.find(x=>x.id==b.dataset.reg);
 box.innerHTML=`<h3>${ev.emoji} ${esc(ev.name)}</h3><div class="meta">🕒 ${fD(ev.date)} · ${fT(ev.date)} &nbsp;📍 ${esc(ev.venue)}</div>
 <label for="fn">Full name</label><input id="fn" autocomplete="name" placeholder="Your name"><div class="err" id="e-fn"></div>
 <label for="fe">Email</label><input id="fe" type="email" autocomplete="email" placeholder="you@example.com"><div class="err" id="e-fe"></div>
 <div class="row"><div><label for="fc">College</label><input id="fc" placeholder="ABESEC"><div class="err" id="e-fc"></div></div>
 <div><label for="fy">Year</label><select id="fy"><option value="">Select</option><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option><option>Postgraduate</option></select><div class="err" id="e-fy"></div></div></div>
 <label for="fp">Phone number</label><input id="fp" type="tel" inputmode="tel" autocomplete="tel" placeholder="10-digit mobile"><div class="err" id="e-fp"></div>
 <div class="acts"><button class="btn o" id="cx">Cancel</button><button class="btn" id="sub">Submit registration</button></div>`;
 modal.classList.add("open");$("#fn").focus();$("#cx").onclick=close;
 $("#sub").onclick=async()=>{
  const v={n:$("#fn").value.trim(),e:$("#fe").value.trim(),c:$("#fc").value.trim(),y:$("#fy").value,p:$("#fp").value.replace(/[\s-]/g,"")};
  const er={fn:v.n.length<2&&"Enter your name",fe:!/^\S+@\S+\.\S+$/.test(v.e)&&"Enter a valid email",fc:!v.c&&"Enter your college",fy:!v.y&&"Select your year",fp:!/^(\+91)?[6-9]\d{9}$/.test(v.p)&&"Enter a valid 10-digit phone"};
  let bad=false;for(const k in er){$("#e-"+k).textContent=er[k]||"";if(er[k])bad=true}
  if(bad)return;
  const s=$("#sub");s.disabled=true;s.textContent="Submitting…";
  if(LIVE){try{const r=await fetch("/api/register",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({eventId:ev.id,name:v.n,email:v.e,college:v.c,year:v.y,phone:v.p})});
   const j=await r.json();if(!r.ok){$("#e-fp").textContent=j.error||"Registration failed";s.disabled=false;s.textContent="Submit registration";return}}
   catch(x){$("#e-fp").textContent="Server unreachable. Is it running?";s.disabled=false;s.textContent="Submit registration";return}}
  regs.push(ev.id);try{localStorage.setItem("regs",JSON.stringify(regs))}catch(x){}
  box.innerHTML=`<div class="ok"><div class="c">✓</div><h3>You're in, ${esc(v.n.split(" ")[0])}!</h3>
  <p class="meta" style="margin:6px 0 0">Your spot for <b>${esc(ev.name)}</b> is saved.<br>See you on ${fD(ev.date)} at ${fT(ev.date)}.</p>
  ${LIVE?"":'<div class="note">Demo mode: data is not stored on a server.</div>'}
  <button class="btn" id="dn" style="margin-top:18px;width:100%">Done</button></div>`;
  $("#dn").onclick=()=>{close();route()};
 };
});
</script>
</body>
</html>
